<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Comparison</title>
  <style>
    body { margin: 0; background: radial-gradient(ellipse at 50% 15%, #1a1a1e 0%, #050506 65%); height: 100vh; overflow: hidden; font-family: ui-monospace, monospace; }
    #stage { position: fixed; inset: 0; }
    h1 { position: fixed; top: 4vh; width: 100%; text-align: center; color: #e8e8e8; font-size: 1.6rem; margin: 0; }
    .label { position: fixed; bottom: 5vh; color: #cfcfcf; text-align: center; width: 34vw; }
    .label small { color: #8a8a8a; display: block; margin-top: 0.4rem; line-height: 1.5; }
    #label-glb { left: 12vw; }
    #label-js { right: 12vw; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <h1>Same robot, two pipelines</h1>
  <div id="stage"></div>
  <div class="label" id="label-glb">Blender &rarr; GLB
    <small>Modeled in Blender (Python), exported robot.glb (902&nbsp;KB).<br>Editable visually in Blender's GUI.</small>
  </div>
  <div class="label" id="label-js">Pure three.js
    <small>Primitives built in code (~4&nbsp;KB of JS, no asset file).<br>Editable only by changing code.</small>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { buildPrimitivesRobot } from './javascript-files/robot-primitives.js?v=1';
    import { buildPointCloudHead } from './javascript-files/point-cloud-head.js?v=1';

    const container = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, container.clientWidth / container.clientHeight, 0.1, 50);
    camera.position.set(0, 1.55, 3.0);
    camera.lookAt(0, 1.35, 0);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    const key = new THREE.DirectionalLight(0xffffff, 1.6);
    key.position.set(2.5, 3.5, 2.5);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x99aaff, 1.6);
    rim.position.set(-3, 2, -2);
    scene.add(rim);
    scene.add(new THREE.AmbientLight(0xffffff, 0.12));

    const robots = []; // { head, torso, baseY }

    // Left: the Blender-built GLB
    new GLTFLoader().load('assets/robot.glb', (gltf) => {
      gltf.scene.position.x = -0.75;
      scene.add(gltf.scene);
      const torso = gltf.scene.getObjectByName('Torso');
      robots.push({ head: gltf.scene.getObjectByName('Head'), torso, baseY: torso.position.y });
    });

    // Right: the code-built primitives robot
    const js = buildPrimitivesRobot(THREE, RoundedBoxGeometry);
    js.group.position.x = 0.75;
    scene.add(js.group);
    robots.push({ head: js.head, torso: js.torso, baseY: js.torso.position.y });

    // Center: floating point-cloud head
    const cloudHead = buildPointCloudHead(THREE);
    cloudHead.group.position.set(0, 1.5, 0.1);
    scene.add(cloudHead.group);

    const pointer = new THREE.Vector2(0, 0);
    window.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -((e.clientY / window.innerHeight) * 2 - 1);
    });

    const lookTarget = new THREE.Vector3(0, 1.55, 2);
    const desiredQuat = new THREE.Quaternion();
    const currentQuat = new THREE.Quaternion();
    const clock = new THREE.Clock();

    function trackCursor(part, target, smoothing) {
      currentQuat.copy(part.quaternion);
      part.lookAt(target);
      desiredQuat.copy(part.quaternion);
      part.quaternion.copy(currentQuat).slerp(desiredQuat, smoothing);
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      lookTarget.set(pointer.x * 2.0, 1.55 + pointer.y * 1.1, 2.2);
      for (const r of robots) {
        trackCursor(r.head, lookTarget, 0.14);
        trackCursor(r.torso, lookTarget, 0.03);
        r.torso.position.y = r.baseY + Math.sin(t * 1.6) * 0.008;
      }
      trackCursor(cloudHead.group, lookTarget, 0.10);
      cloudHead.group.position.y = 1.5 + Math.sin(t * 1.1) * 0.045;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
