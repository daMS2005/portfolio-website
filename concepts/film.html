<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>All prototypes</title>
    <style>
        body { margin: 0; background: #000; color: #f5f3ef; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
        nav { display: grid; gap: 0.35rem; padding: 0.6rem 1rem; border-bottom: 1px solid #222; max-height: 38vh; overflow-y: auto; }
        nav div { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }
        nav strong { width: 7.5rem; color: #aaa7a2; font-weight: 500; }
        button { padding: 0.32rem 0.6rem; border: 1px solid #333; border-radius: 6px; background: #111; color: inherit; font: inherit; cursor: pointer; }
        button[aria-pressed="true"] { border-color: #ff5c2a; color: #ffb79f; }
        button.liked::after { content: " ★"; color: #ffb347; }
        nav a { color: #aaa7a2; }
        iframe { display: block; width: 100%; height: 100vh; border: 0; }
    </style>
</head>
<body>
    <nav>

            <button data-url="/?concept=film">Whole site (no intro)</button>

            <button data-url="/?concept=film-hero,intro&intro=name">The name</button>
            <button data-url="/?concept=event-horizon,intro&intro=eye">Eye → ring hero</button>
        </div>

        </div>
    </nav>
    <iframe title="Prototype"></iframe>
    <script>
        const frame = document.querySelector('iframe');
        const buttons = document.querySelectorAll('button');
        const show = (url) => {
            frame.src = url;
            document.getElementById('open').href = url;
            buttons.forEach((b) => b.setAttribute('aria-pressed', b.dataset.url === url));
        };
        buttons.forEach((b) => b.addEventListener('click', () => show(b.dataset.url)));
        show(buttons[0].dataset.url);
    </script>
</body>
